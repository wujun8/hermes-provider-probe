name: probe-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck python3-yaml
      - name: Syntax check (bash -n)
        run: bash -n test-provider.sh tests/run.sh
      - name: Shellcheck
        run: shellcheck test-provider.sh tests/run.sh
      - name: Hermetic test suite
        run: bash tests/run.sh
